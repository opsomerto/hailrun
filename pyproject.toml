[project]
name = "hailrun"
version = "0.2.0"
description = "Run local scripts as Hail Batch jobs, with code-context sync, file sharding, and wandb integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<0.27",
    "hail>=0.2.139",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.28"]
parquet = ["pyarrow>=25.0"]
gcs = ["google-cloud-storage", "pandas"]
all = ["hailrun[wandb,parquet,gcs]"]

[project.scripts]
hailrun = "hailrun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hailrun"]

[dependency-groups]
dev = ["pytest>=8"]
